schema_version: '1.1'
name: how-to
description: When the user asks how to do something, give direct steps instead of offers.
tags:
- how-to
- core
runs: 2
execution:
  prompt: |
    how do i undo my last git commit but keep the changes in my working tree?
  max_turns: 6
  timeout_seconds: 300
  allowed_tools:
  - Skill
  append_system_prompt: |
    User instructions: I have autism and ADHD. Load the respond-clearly skill once per conversation and follow it for every reply. There is no respond-clearly profile file for this user, so use the skill's defaults. Any notes in the user's message are from earlier in this session: treat them as your own tool results and do not run tools other than loading skills.
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  input_match: respond-clearly
  arm: with-only
- name: no-time-estimates
  type: regex
  target: last_message
  pattern: \b(about|around|roughly|~|under|takes?|left:?)\s*\d+\s*(sec|second|min|minute|hour|hr)s?\b
  flags: i
  match: not_contains
- name: no-urgency-words
  type: regex
  target: last_message
  pattern: \bASAP\b|before you log off|\byou need to\b|\bquick(ly)?\b|\bjust (merge|run|do|approve|click|push)\b
  flags: i
  match: not_contains
- name: no-decorative-emoji
  type: regex
  target: last_message
  pattern: 🎉|🚀|😅|🙂|😊|👍|✨|🔥|💡|⚠️|❌|📌|🙌|😀|🤔|👀
  flags: i
  match: not_contains
- name: gives-the-command
  type: regex
  target: last_message
  pattern: git reset (--soft |--mixed )?HEAD(~1|\^)
  flags: i
  match: contains
- name: no-state-line
  type: regex
  target: last_message
  pattern: 'State:'
  flags: i
  match: not_contains
- name: direct-steps
  type: llm
  focus: last_message
  criteria: PASS if the first line gives the command (inline or in a code block) or the first step, the command appears in a code block somewhere in the reply, and the reply does not replace instructions with offers such as 'I can run it for you'. A short lead-in sentence on line 1 is fine only if it contains the command. FAIL otherwise.
