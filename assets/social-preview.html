<style>
* { box-sizing: border-box; margin: 0; } html, body { width: 1280px; height: 640px; overflow: hidden; }
.bar { display:block; height: 13px; border-radius: 7px; }
.row { display:flex; align-items:center; gap: 16px; height: 46px; }
.row .bar { height: 16px; border-radius: 8px; }
.e { font-size: 30px; width: 40px; text-align:center; }
.wall { display:flex; flex-direction:column; gap: 11px; }

body { background: radial-gradient(1100px 600px at 15% -10%, #233B6E 0%, #0D1117 62%); color:#E6EDF3; font-family:-apple-system, sans-serif; padding: 38px 64px 34px; display:flex; flex-direction:column; gap: 26px; }
h1 { font-family: "SF Mono", Menlo, monospace; font-size: 66px; font-weight: 800; line-height:1; background: linear-gradient(90deg,#7EE787,#79C0FF 55%,#D2A8FF); -webkit-background-clip:text; color:transparent; }
.sub { font-size: 27px; color:#9DA7B3; margin-top: 12px; }
.cards { display:flex; gap: 22px; height: 360px; flex: none; }
.card { flex:1; background:#161B22; border:1px solid #30363D; border-radius:16px; padding: 50px 30px 20px; position:relative; overflow:hidden; }
.card::before { content:""; position:absolute; left:0; right:0; top:0; height:38px; background:#21262D; }
.card::after { content:"● ● ●"; position:absolute; left:16px; top:8px; font-size:15px; letter-spacing:3px; color:#6E7681; }
.sticker { position:absolute; top:9px; right:18px; z-index:1; font-family: Menlo, monospace; font-size: 15px; font-weight:700; letter-spacing: 2px; }
.before .sticker { color:#FF7B72; } .after .sticker { color:#7EE787; }
.before .bar { background:#30363D; } .after .bar { background:#3D444D; } .after .bar.strong { background:#7EE787; height: 22px; }
.after { border-color:#2EA043; box-shadow: 0 0 0 1px #2EA043, 0 0 50px rgba(46,160,67,.3); }
.rows { display:flex; flex-direction:column; gap: 6px; }
.arrow { align-self:center; font-size: 50px; color:#6E7681; }
.foot { text-align:right; font-family: Menlo, monospace; font-size: 18px; color:#8B949E; }

.xmark { position:absolute; left:22px; right:22px; top:50px; bottom:16px; width:calc(100% - 44px); height:calc(100% - 66px); filter: drop-shadow(0 0 8px rgba(255,92,92,.75)); z-index: 2; }
.row { height: 36px; }
.t { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; border: 1px solid #30363D; border-radius: 10px; overflow: hidden; }
.t th, .t td { padding: 9px 12px; border-bottom: 1px solid #30363D; }
.t tr:last-child td { border-bottom: none; }
.t th { background: #21262D; }
.t .bar { height: 11px; border-radius: 6px; }
.t .hb { background: #79C0FF !important; opacity: .8; }
.t .ok { color: #7EE787; font-weight: 800; font-size: 18px; width: 50px; text-align: center; }
.after .e { background: #E6EDF3; border-radius: 10px; width: 44px; height: 36px; display:flex; align-items:center; justify-content:center; font-size: 26px; box-shadow: 0 0 0 1px #8B949E inset; }
</style></head><body><div class="head"><h1>respond-clearly</h1><div class="sub">AI replies for ADHD and autistic brains.</div></div>

</div></div></div>
